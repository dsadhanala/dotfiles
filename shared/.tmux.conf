# change the prefix from 'C-b' to '`'
# (remap capslock to CTRL for easy access)
# new-session
unbind C-b
# set-option -g prefix `
set -g prefix `

# ============================================================
# OS-specific clipboard integration
# Auto-detected via `uname`. tmux runs only the matching block.
# To force one OS, comment out the other if-shell block below.
# ============================================================
# macOS: uses pbcopy / pbpaste (built in)
if-shell 'test "$(uname -s)" = "Darwin"' {
  bind-key -T copy-mode-vi M-y send -X copy-pipe-and-cancel "pbcopy" \; display-message "copied to system clipboard"
  bind-key p run-shell "pbpaste | tmux load-buffer - ; tmux paste-buffer"
}
# Linux: uses xclip / xsel  (install: apt install xclip xsel)
if-shell 'test "$(uname -s)" = "Linux"' {
  bind-key -T copy-mode-vi M-y send -X copy-pipe "xclip -i -sel p -f | xclip -i -sel c" \; display-message "copied to system clipboard"
  bind-key p run-shell "xsel -o | tmux load-buffer - ; tmux paste-buffer"
}

# send the prefix to client inside window
bind-key -n C-z send-prefix

# insert tilde if pressed twice
bind ` send-key `

set-option -g history-limit 30000

bind X confirm-before kill-session

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -
bind-key \\ split-window -h
bind-key - split-window -v

# unbind "'"
unbind %

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set-option -g allow-rename off

# Ctrl-K is left unbound in tmux so the shell keeps it (kill-to-end-of-line).
# Scrollback-clear lives on `prefix + k` instead (see below).

# mouse control (clickable windows, panes, resizable panes)
#set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# clear tmux scrollback with prefix + k (Ctrl-K stays with the shell)
bind k clear-history \; display-message "scrollback cleared"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# present a menu of URLs to open from the visible pane. sweet.
bind-key u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


######################
### DESIGN CHANGES ###
######################

# panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

## Status bar design
# status line
#set -g status-utf8 on
set -g status-justify left
set -g status-style bg=default,fg=colour9
set -g status-interval 2

# messaging
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#window mode
setw -g mode-style bg=colour6,fg=colour0

#set inactive/active window styles
set -g window-style 'fg=colour245,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'

# window status
setw -g window-status-format " #F#I:#W#F "
setw -g window-status-current-format " #F#I:#W#F "
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "

setw -g window-status-current-style bg=colour0,fg=colour11,dim
setw -g window-status-style bg=green,fg=black,reverse

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# set default terminal mode to 256 colors
set -g default-terminal "screen-256color"

# The modes {
setw -g clock-mode-colour colour3
setw -g mode-style bg=colour166,fg=colour255,bold

